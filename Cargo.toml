[package]
name = "octolib"
version = "0.36.2"
edition = "2021"
authors = ["Muvon Un Limited <contact@muvon.io>"]
license = "Apache-2.0"
description = "Self-sufficient AI provider library with multi-provider support, embedding models, model validation, and cost tracking"
homepage = "https://octomind.run/product/octolib"
repository = "https://github.com/muvon/octolib"
keywords = ["ai", "llm", "embeddings", "providers", "openai"]
categories = ["api-bindings", "development-tools"]

# Exclude scripts folder from crate publishing
exclude = ["scripts/"]

[features]
default = ["llm", "embeddings", "reranker", "media", "fastembed", "huggingface"]

# Capability modules. Each gates one top-level module and the dependencies only
# it needs, so an LLM-only build does not compile the media or embedding stack.
llm = ["dep:jsonschema", "dep:jsonwebtoken"]
embeddings = ["dep:tiktoken-rs"]
reranker = []
media = ["dep:base64"]

# Local embedding backends. Both are useless without the embedding module, so
# they enable it.
fastembed = ["embeddings", "dep:fastembed"]
huggingface = ["embeddings", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

# Hardware acceleration — enable whichever matches your hardware.
# Each feature activates the backend in both candle and fastembed (when those features are active).
metal = ["fastembed?/metal", "candle-core?/metal", "candle-nn?/metal"]
mkl = ["fastembed?/mkl", "candle-core?/mkl", "candle-nn?/mkl"]
accelerate = ["fastembed?/accelerate", "candle-core?/accelerate", "candle-nn?/accelerate"]
cuda = ["fastembed?/cuda", "candle-core?/cuda", "candle-nn?/cuda"]
cudnn = ["fastembed?/cudnn", "candle-core?/cudnn", "candle-nn?/cudnn"]

[dependencies]
async-trait = "0.1.89"
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli", "zstd", "deflate", "http2", "charset"], default-features = false }
tokio = { version = "1.52.3", features = ["time", "sync", "macros", "rt-multi-thread"] }
arc-swap = "1"
base64 = { version = "0.22", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
dirs = "6.0.0"
jsonwebtoken = { version = "10", optional = true }
# Schema validation only — no $ref resolution over HTTP/file needed (client
# schemas are self-contained), so default features (which pull in a second
# reqwest/rustls stack) are disabled.
jsonschema = { version = "0.46.9", default-features = false, optional = true }

sha2 = "0.10"
hex = "0.4"

# Configuration file handling (utils::config_migration / utils::config_file):
# toml_edit preserves user comments and formatting across migrations, fs4 gives
# the cross-platform advisory lock, uuid names the atomic-write temp file.
toml_edit = "0.25.13"
fs4 = "0.8.4"
uuid = { version = "1", features = ["v4"] }

# Embedding dependencies
tiktoken-rs = { version = "0.9.1", optional = true }

# Optional embedding provider dependencies
fastembed = { version = "5.13.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
# Candle dependencies for HuggingFace support (optional)
# Pinned to 0.10.2 to match fastembed's candle version (qwen3 feature)
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22.2", optional = true }
# HuggingFace Hub - use rustls-tls to avoid native-tls dependency
# Pinned to 0.4.x to share single version with fastembed (which uses hf-hub 0.4.1)
hf-hub = { version = "0.4.3", default-features = false, features = ["tokio", "rustls-tls"], optional = true }

# Examples only build when the module they exercise is enabled.

[[example]]
name = "amazon_bedrock"
required-features = ["llm"]

[[example]]
name = "anthropic_oauth"
required-features = ["llm"]

[[example]]
name = "cloudflare_workers_ai"
required-features = ["llm"]

[[example]]
name = "fireworks_chat"
required-features = ["llm"]

[[example]]
name = "google_vertex_ai"
required-features = ["llm"]

[[example]]
name = "hetzner_chat"
required-features = ["llm"]

[[example]]
name = "local_chat"
required-features = ["llm"]

[[example]]
name = "meta_chat"
required-features = ["llm"]

[[example]]
name = "minimax_chat"
required-features = ["llm"]

[[example]]
name = "moonshot_vision"
required-features = ["llm"]

[[example]]
name = "openai_oauth"
required-features = ["llm"]

[[example]]
name = "structured_output"
required-features = ["llm"]

[[example]]
name = "test_structured_output"
required-features = ["llm"]

[[example]]
name = "xai"
required-features = ["llm"]

[[example]]
name = "media_fal"
required-features = ["media"]

[[example]]
name = "media_openrouter"
required-features = ["media"]

[[example]]
name = "media_openrouter_audio_video"
required-features = ["media"]

[[example]]
name = "media_replicate"
required-features = ["media"]

[[example]]
name = "openrouter_embeddings"
required-features = ["embeddings"]

[[example]]
name = "reranker_basic"
required-features = ["reranker"]

[[example]]
name = "reranker_comparison"
required-features = ["reranker"]

[dev-dependencies]
# Examples encode local media inline regardless of which features are on.
base64 = "0.22"
serial_test = "3.4.0"
tracing-subscriber = "0.3"
# Migration tests assert on the parsed result, not on the edited document.
toml = "1.1"

# Release build: optimized for distribution (no native-specific instructions)
[profile.release]
opt-level = "z"
lto = "thin"           # faster than "fat" lto, still significant gains
codegen-units = 1      # max optimization, slower compile
strip = "symbols"
