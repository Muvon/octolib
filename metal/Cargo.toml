[package]
name = "octolib-metal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Platform-gated Metal dependencies for octolib"
repository = "https://github.com/muvon/octolib"

[features]
default = []
fastembed = ["dep:fastembed"]
huggingface = ["dep:candle-core", "dep:candle-nn"]

[target.'cfg(target_os = "macos")'.dependencies]
fastembed = { version = "5.13.4", default-features = false, features = ["metal"], optional = true }
candle-core = { version = "0.10.2", features = ["metal"], optional = true }
candle-nn = { version = "0.10.2", features = ["metal"], optional = true }
