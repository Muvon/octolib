name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

# A new push supersedes whatever is still running for the same branch or PR —
# there is no point burning runners on a commit nobody is looking at any more.
# Grouping by workflow + ref keeps master, each branch and each PR independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust CI
    uses: muvon/ci-workflow/.github/workflows/rust-ci.yml@master
    with:
      feature-flags: '--features fastembed,huggingface'
      test-script: |
        cargo test --verbose --lib --no-default-features
        if [ "$RUNNER_OS" != "Windows" ]; then
          cargo test --verbose --lib --features fastembed,huggingface
          cargo test --verbose --lib --no-default-features --features fastembed
          cargo test --verbose --lib --no-default-features --features huggingface
        fi
      # Shared tarpaulin job uploads to Codecov without a token, so nothing
      # ever lands. Replaced by the llvm-cov `coverage` job below.
      coverage: false

  coverage:
    name: Coverage Report
    permissions:
      contents: write # push the badge JSON to the `badges` branch
    uses: muvon/ci-workflow/.github/workflows/rust-coverage.yml@master
    with:
      # Mirrors the CI test run: lib tests with all provider features on
      feature-flags: '--lib --features fastembed,huggingface'

  brief:
    uses: muvon/ci-workflow/.github/workflows/brief.yml@master
    secrets: inherit
